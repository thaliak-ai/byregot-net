name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build ByregotNet/ByregotNet.csproj -c Release

      - name: Package
        run: |
          cd ByregotNet/bin/Release
          zip -r ../../../byregot-net.zip . --exclude '*.pdb'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: byregot-net.zip
          generate_release_notes: false
