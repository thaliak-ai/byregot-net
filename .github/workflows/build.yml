name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          set -euo pipefail
          mkdir -p $HOME/.xlcore/dalamud/Hooks/dev
          curl -fsSL "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d $HOME/.xlcore/dalamud/Hooks/dev

      - name: Build
        run: dotnet build ByregotNet/ByregotNet.csproj -c Release

      - name: Package
        run: |
          cd ByregotNet/bin/Release
          zip byregot-net.zip \
            ByregotNet.dll \
            ByregotNet.json \
            Microsoft.ML.OnnxRuntime.dll \
            System.Numerics.Tensors.dll
          zip -r byregot-net.zip runtimes/win-x64/
          mv byregot-net.zip ../../../

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: byregot-net.zip
          generate_release_notes: false
