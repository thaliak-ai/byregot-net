name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          set -euo pipefail
          curl -fsSL "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        run: dotnet build ByregotNet/ByregotNet.csproj -c Release -p:DALAMUD_HOME=$DALAMUD_HOME

      - name: Package
        run: |
          cd ByregotNet/bin/Release
          zip -r ../../../byregot-net.zip . --exclude '*.pdb'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: byregot-net.zip
          generate_release_notes: false
